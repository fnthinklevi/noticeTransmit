org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 内置 Kotlin（AGP 9 默认 true，此处**不再显式声明**）：Kotlin 由 AGP 自己编译，
# 项目侧不再 apply KGP。2026-10-21 之前这里写着 `android.builtInKotlin=false`，
# 后果是 Flutter 的 Gradle 插件替每个 Android 子工程各 apply 一次 `kotlin-android`
# （FlutterPluginUtils.kt 的 detectApplyingKotlinGradlePlugin），于是 :app 与 10 个
# 插件工程各报一条「Deprecated 'org.jetbrains.kotlin.android' plugin usage」。
# KGP 仍留在 settings.gradle.kts 的 plugins 块里（apply false），只做**编译器版本钉**：
# AGP 9.3.0 自带 KGP 2.2.10，钉住 2.4.21 才不退版；AGP 的内置 Kotlin 下限是 2.1.0。
#
# ⚠ `android.newDsl` **必须保持 false**：Flutter 3.47.7 的 Gradle 插件仍在调 legacy
# variant API（FlutterPlugin.kt 的 applicationVariants / libraryVariants，上游 TODOs
# 见 flutter/flutter#166550）。翻成 true ⇒ applicationVariants 不再可用。
# 这条与下面那条 suppress 一起，等 Flutter 迁完 variant API 后一并删除。
android.newDsl=false
# AGP 按自己给的建议抑制两类警告（2026-10-21）：
#   · UNSUPPORTED_PROJECT_OPTION_USE —— 上面 android.newDsl 那条「选项已弃用」
#   · DEPRECATED_DSL —— Flutter 3.47.7 调 legacy variant API 触发的
#     applicationVariants / libraryVariants 过时警告
# ⚠ 这两行**不是**「问题已解决」，而是「已知且解禁条件明确」：等 Flutter 迁完
# variant API（flutter/flutter#166550）后，删 android.newDsl 与这一行一起删。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# 全局 Java 编译目标（消除 "源值 8 已过时" 警告）
org.gradle.java.source=21
org.gradle.java.target=21
