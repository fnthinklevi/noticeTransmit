include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # `outputs/` 是本地工装与备份目录（已 gitignore），里面的 `*.dart` 是**旧代码的副本**。
    # 不排除时它们会混进 `flutter analyze`：v1.5.76 发版跑到这一步一次报出 1987 条，
    # 全部来自这里 —— 而闸门与 CI 只看 lib/test，等于发版脚本自己有一处永远红。
    - "outputs/**"
    - "build/**"

linter:
  rules:
    # avoid_print 保持启用：统一使用 debugPrint（release 可移除），print 禁用
    avoid_print: true
    prefer_final_fields: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
    avoid_empty_else: true
    prefer_const_declarations: true
    require_trailing_commas: true
    avoid_web_libraries_in_flutter: true

# （原 `dart_code_metrics:` 段已删，roadmap E2）该工具 4.12.0 自带 analyzer 3.3.1，
# 在 Dart 3.12 上恒崩、CI 那一步又不判退出码，等于零作用；它原来配的 4 条规则里
# prefer-trailing-comma 与上面 require_trailing_commas 重复。别再把它加回来。
