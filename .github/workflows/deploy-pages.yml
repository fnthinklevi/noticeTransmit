name: Deploy to GitHub Pages

# 将官网和版本配置发布到 GitHub Pages（静态站：官网首页 + /api/version.json）。
# ⚠ 这条通道服务的是**官网**，不是 App：App 只请求 Node 的 /api/version/check，
#   不读这里的静态文件（原先"失败后回退 /api/version.json"那条已在提交 cbec666 删除 ——
#   服务端没有那个路由，两个官方域名实测都回 404）。纯 Pages 部署因此**不能**给 App 提供更新；
#   详见 server/GITHUB_PAGES.md（English: server/GITHUB_PAGES-en.md）。

on:
  push:
    branches: [main]
    paths:
      - 'server/data/version.json'
      - 'server/public/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Pages artifact
        run: |
          mkdir -p _pages/api
          # 官网静态文件
          cp -r server/public/* _pages/
          # 版本配置（静态 JSON，客户端回退模式使用）
          cp server/data/version.json _pages/api/version.json
          # 防止 Jekyll 干扰 JSON 文件
          touch _pages/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}
