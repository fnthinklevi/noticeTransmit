name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      # 与 PR 门禁同一份脚本：根包 + 每一个嵌套包都要在 analyze 之前解析
      # （根 pub get 不替嵌套包生成 .dart_tool，漏掉的表现就是下面 analyze 一整屏
      # "Target of URI doesn't exist"）
      - name: Flutter pub get（根 + 每一个嵌套包）
        run: bash .github/scripts/pub_get_all_packages.sh

      - name: Dart format check
        run: $FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart format --set-exit-if-changed lib/

      - name: Run unit tests
        run: flutter test --no-pub

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest > android_test_output.log 2>&1
          EXIT_CODE=$?
          cat android_test_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Android单元测试失败，CI失败"
            exit 1
          fi
          echo "✅ Android单元测试通过"

      # ⚠ 这一步原本是**结构性假绿**：判据写的是 `grep -E "^ +error •"`，而 flutter 3.44 的
      # analyze 输出形如 `  error - <消息> - <文件>:<行>:<列> - <规则>`，没有 `•` 也没有 `error •`
      # ⇒ grep 恒不命中，永远打印"✅ 无致命代码错误"；`EXIT_CODE` 取了出来却没读。
      # 也就是说发版路径上这道门禁一道都没判过红（与已删的 dart_code_metrics 步同一族）。
      # 现在与 PR 门禁同口径：--fatal-infos + 按退出码判红。
      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --no-pub --fatal-infos > analyze_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat analyze_output.log
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ flutter analyze --fatal-infos 退出码 $EXIT_CODE，发版中止"
            exit 1
          fi
          echo "✅ analyze 无 error / warning / info"

      - name: Modify gradle repositories to official source
        run: |
          sed -i '/maven.*aliyun/d' android/build.gradle.kts
          sed -i '/maven.*aliyun/d' android/settings.gradle.kts
          sed -i 's/repositories {/repositories {\n        google()\n        mavenCentral()/' android/build.gradle.kts
          sed -i 's/repositories {/repositories {\n        google()\n        mavenCentral()/' android/settings.gradle.kts

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/keystore_base64.txt
          python3 -c "import base64; open('android/app/key.jks', 'wb').write(base64.b64decode(open('/tmp/keystore_base64.txt').read().strip()))"
          ls -la android/app/key.jks
          sha256sum android/app/key.jks

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_FILE: key.jks

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "APK_NAME=notice_all_${VERSION}+${BUILD}.apk" >> $GITHUB_OUTPUT

      - name: 纯净度 + 版本号双闸（base.md §10.2 步骤 6.5 铁律）
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # 单架构包必须只含一种 .so：--target-platform 管不住第三方依赖的 ABI，
          # 而 abiFilters 在 FLUTTER_TARGET_PLATFORM 缺失时会回退成全架构 —— 只有
          # 事后校验能拦住「按 arm64 名义归档的伪融合包」。
          python3 tools/verify_apk_purity.py "$APK" arm64
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -2)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.build }}'" || { echo "❌ versionCode 与 pubspec 不符（Gradle daemon 配置缓存吞掉了版本变更），禁止归档"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.version }}'" || { echo "❌ versionName 与 pubspec 不符，禁止归档"; exit 1; }
          echo "✅ 纯净度与版本号双闸通过"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version.outputs.APK_NAME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.APK_NAME }}
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.APK_NAME }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/${{ steps.version.outputs.APK_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
