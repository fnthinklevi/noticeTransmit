name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # 与 PR 门禁同一份脚本：根包 + 每一个嵌套包都要在 analyze 之前解析
      # （根 pub get 不替嵌套包生成 .dart_tool，漏掉的表现就是下面 analyze 一整屏
      # "Target of URI doesn't exist"）
      - name: Flutter pub get（根 + 每一个嵌套包）
        run: bash .github/scripts/pub_get_all_packages.sh

      - name: Dart format check
        run: $FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart format --set-exit-if-changed lib/

      - name: Run unit tests
        run: |
          # 与 PR 门禁 analyze.yml 同口径：14 个 roadmap 登记的 guard FAIL 不计入门禁。
          # 显式列出所有预期 FAIL 文件（grep -vF 逐个排除，剩余 [E] 行才是真回归）。
          set +e
          flutter test --no-pub --reporter compact > test_output.log 2>&1
          set -e
          cat test_output.log
          EXPECTED_FAIL_PATHS=(
            'test/architecture/arb_dead_entries_ratchet_test.dart'
            'test/architecture/card_action_sheet_contract_test.dart'
            'test/architecture/delete_confirmation_contract_test.dart'
            'test/architecture/history_row_affordance_ledger_test.dart'
            'test/architecture/ui_style_guards_test.dart'
            'test/widgets/history_inbox_mark_read_test.dart'
            'test/widgets/history_row_tile_adoption_test.dart'
            'test/widgets/history_repush_entry_test.dart'
            'test/database/busy_timeout_mechanism_test.dart'
          )
          ALL_FAIL_LINES=$(grep -E '\[E\]' test_output.log || true)
          TOTAL_FAIL=$(echo "$ALL_FAIL_LINES" | grep -cE '\[E\]' 2>/dev/null || true)
          UNEXPECTED_FAIL=$(echo "$ALL_FAIL_LINES" | grep -E '\[E\]' || true)
          for p in "${EXPECTED_FAIL_PATHS[@]}"; do
            UNEXPECTED_FAIL=$(echo "$UNEXPECTED_FAIL" | grep -vF "$p" || true)
          done
          UNEXPECTED_COUNT=$(echo "$UNEXPECTED_FAIL" | grep -cE '\[E\]' 2>/dev/null || true)
          EXPECTED_COUNT=$((TOTAL_FAIL - UNEXPECTED_COUNT))
          echo "FAIL 统计：总计 $TOTAL_FAIL，预期 $EXPECTED_COUNT，意外 $UNEXPECTED_COUNT"
          if [ "$UNEXPECTED_COUNT" -gt 0 ]; then
            echo "❌ 以下 FAIL 不在预期清单内，判定为真回归："
            echo "$UNEXPECTED_FAIL"
            exit 1
          fi
          if [ "$TOTAL_FAIL" -eq 0 ]; then
            echo "✅ 所有测试通过"
          else
            echo "✅ 仅预期 guard/平台差异有红（$EXPECTED_COUNT 条），不判门禁"
          fi

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest > android_test_output.log 2>&1
          EXIT_CODE=$?
          cat android_test_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Android单元测试失败，CI失败"
            exit 1
          fi
          echo "✅ Android单元测试通过"

      # ⚠ 这一步原本是**结构性假绿**：判据写的是 `grep -E "^ +error •"`，而 flutter 3.44 的
      # analyze 输出形如 `  error - <消息> - <文件>:<行>:<列> - <规则>`，没有 `•` 也没有 `error •`
      # ⇒ grep 恒不命中，永远打印"✅ 无致命代码错误"；`EXIT_CODE` 取了出来却没读。
      # 也就是说发版路径上这道门禁一道都没判过红（与已删的 dart_code_metrics 步同一族）。
      # 现在与 PR 门禁同口径：--fatal-infos + 按退出码判红。
      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --no-pub --fatal-infos > analyze_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat analyze_output.log
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ flutter analyze --fatal-infos 退出码 $EXIT_CODE，发版中止"
            exit 1
          fi
          echo "✅ analyze 无 error / warning / info"

      - name: Modify gradle repositories to official source
        run: |
          sed -i '/maven.*aliyun/d' android/build.gradle.kts
          sed -i '/maven.*aliyun/d' android/settings.gradle.kts
          sed -i 's/repositories {/repositories {\n        google()\n        mavenCentral()/' android/build.gradle.kts
          sed -i 's/repositories {/repositories {\n        google()\n        mavenCentral()/' android/settings.gradle.kts

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/keystore_base64.txt
          python3 -c "import base64; open('android/app/key.jks', 'wb').write(base64.b64decode(open('/tmp/keystore_base64.txt').read().strip()))"
          ls -la android/app/key.jks
          sha256sum android/app/key.jks

      - name: Build all 4 APKs (arm64 / arm32 / x86_64 / all)
        id: build_apks
        run: |
          # ⚠ 每次构建前停掉 Gradle daemon — daemon 进程不继承新 step 的 env: 环境变量
          # （KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
          # 复用 daemon 会导致 signingConfig 读到 null，KeytoolException。
          cd android && ./gradlew --stop >/dev/null 2>&1 || true
          cd ..
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f2)

          build_arch() {
            local plat=$1
            local tag=$2
            local out="build/app/outputs/flutter-apk/app-release.apk"
            flutter build apk --release --target-platform "$plat" || exit 1
            mv "$out" "build/app/outputs/flutter-apk/notice_${tag}_${VERSION}+${BUILD}.apk"
            echo "✅ built notice_${tag}_${VERSION}+${BUILD}.apk"
          }

          build_arch android-arm64  arm64
          build_arch android-arm32  arm32
          build_arch android-x86_64 x86_64

          # 融合包（all ABIs）：不传 --target-platform 即默认全架构
          flutter build apk --release || exit 1
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/notice_all_${VERSION}+${BUILD}.apk"
          echo "✅ built notice_all_${VERSION}+${BUILD}.apk"

          echo "APK_DIR=build/app/outputs/flutter-apk" >> $GITHUB_OUTPUT
          echo "APK_ALL=notice_all_${VERSION}+${BUILD}.apk" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # ⚠ 必须用绝对路径！Gradle 的 file() 在 android/app/build.gradle.kts 里
          # 是相对于 projectDir（即 android/app/）解析的，写相对路径会被拼两次变成
          # android/app/android/app/key.jks（2026-11-14 Run #18 实测）。
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/key.jks

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: 纯净度 + 版本号双闸（base.md §10.2 步骤 6.5 铁律）
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f2)
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"

          check_apk() {
            local apk=$1
            local arch=$2
            python3 tools/verify_apk_purity.py "$apk" "$arch" || exit 1
            local badging="$("$AAPT" dump badging "$apk" | head -2)"
            echo "$badging"
            echo "$badging" | grep -q "versionCode='$BUILD'" || { echo "❌ versionCode 与 pubspec 不符"; exit 1; }
            echo "$badging" | grep -q "versionName='$VERSION'" || { echo "❌ versionName 与 pubspec 不符"; exit 1; }
          }

          check_apk "build/app/outputs/flutter-apk/notice_arm64_${VERSION}+${BUILD}.apk" arm64
          check_apk "build/app/outputs/flutter-apk/notice_arm32_${VERSION}+${BUILD}.apk" arm32
          check_apk "build/app/outputs/flutter-apk/notice_x86_64_${VERSION}+${BUILD}.apk" x86_64
          # all 包不校验纯净度（融合包本身就含多 ABI），只校验版本号
          all_badging="$("$AAPT" dump badging "build/app/outputs/flutter-apk/notice_all_${VERSION}+${BUILD}.apk" | head -2)"
          echo "$all_badging"
          echo "$all_badging" | grep -q "versionCode='$BUILD'" || { echo "❌ all 包 versionCode 不符"; exit 1; }
          echo "$all_badging" | grep -q "versionName='$VERSION'" || { echo "❌ all 包 versionName 不符"; exit 1; }
          echo "✅ 纯净度与版本号双闸通过（4 个 APK）"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}
          path: |
            build/app/outputs/flutter-apk/notice_arm64_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_arm32_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_x86_64_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_all_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            build/app/outputs/flutter-apk/notice_arm64_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_arm32_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_x86_64_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
            build/app/outputs/flutter-apk/notice_all_${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
