name: Analyze & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: |
          set +e
          flutter analyze --no-pub > analyze_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat analyze_output.log
          if grep -E "^ +error •" analyze_output.log; then
            echo "❌ 存在代码错误，CI失败"
            exit 1
          fi
          echo "✅ 无致命代码错误，仅风格提示已忽略"

      - name: Version consistency check
        run: bash .github/scripts/check_version_consistency.sh

      - name: Run code metrics analysis
        run: |
          set +e
          dart run dart_code_metrics:metrics analyze lib/ --reporter=github > metrics_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat metrics_output.log
          echo "代码质量检测完成"

      - name: Run unit tests
        run: |
          set +e
          flutter test --no-pub --coverage > test_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat test_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 测试失败，CI失败"
            exit 1
          fi
          echo "✅ 所有测试通过"

      # ↓ 以下三步把 base.md §10.2「按 GitHub Actions 检验流程完整自检」声明的
      #   6 项检查真正接进 PR 门禁。此前 Android 单元测试只在打 tag 的
      #   build-apk.yml 里跑（合入前不受约束），服务端契约测试则完全没接 CI。

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android unit tests (JVM)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

      # Android lint：抓编译器与 flutter analyze 都看不见的跨版本误用
      # （NewApi / WrongConstant / 未加导出标志的 registerReceiver 等——在 minSdk 24
      # 上表现为运行期 NoSuchMethodError，而不是编译错误）。
      # 已知误报由 android/app/lint-baseline.xml 兜住；新增 issue 不在基线内 → 依旧红。
      - name: Android lint (debug)
        working-directory: android
        run: ./gradlew :app:lintDebug --console=plain

      # Node 版本必须与生产一致（服务器 pm2 跑的是 24 LTS）——CI 用 EOL 运行时测服务端，
      # 等于测了一个生产不该跑的版本；反之亦然。版本单一真值见 server/package.json 的 engines。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Server HTTP contract tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

      # 代码格式统一闸门（本地跑同一支：bash .github/scripts/check_format.sh --fix）
      # 三路一并校验：dart format / ktlint 1.8.0（规则见仓库根 .editorconfig）/ prettier。
      # 放在 JDK 与 server/node_modules 就绪之后，prettier 直接复用 npm script。
      - name: Code format check (Dart / Kotlin / JS)
        run: bash .github/scripts/check_format.sh

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          genhtml coverage/lcov.info -o coverage/html
          echo "✅ 代码覆盖率报告已生成"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/