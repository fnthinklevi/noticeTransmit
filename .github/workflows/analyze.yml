name: Analyze & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # 嵌套包必须**在 analyze 之前**解析自己的 dev_dependencies，理由见脚本头部注释
      # （一句话版：`flutter analyze` 不带路径会走进 packages/**，包没解析就是一整屏
      # "Target of URI doesn't exist"，而根 pub get 不替嵌套包生成 .dart_tool）。
      - name: Flutter pub get（根 + 每一个嵌套包）
        run: bash .github/scripts/pub_get_all_packages.sh

      - name: Flutter analyze
        run: |
          set +e
          # --fatal-infos：以前这步只 grep `error •`，warning 与 info 全放过（"仅风格提示已忽略"），
          # 于是 analysis_options.yaml 里那批 lint 规则实际上没有门禁。现在按退出码判红。
          # 本机基线实测（与 CI 同命令、同画像：不带路径 ⇒ 连 packages/** 一起分析）：
          #   嵌套包未解析 → exit 1、286 条问题（首条即 packages\fnthink_push\test\… uri_does_not_exist）
          #   跑过上一步 pub get 脚本 → "No issues found!"、exit 0
          flutter analyze --no-pub --fatal-infos > analyze_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat analyze_output.log
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ flutter analyze --fatal-infos 退出码 $EXIT_CODE，CI 失败"
            exit 1
          fi
          echo "✅ analyze 无 error / warning / info"

      # 幻念推送包（T71，path 依赖）：这一跑是它自己的门禁（包级 analyze + dart test）。
      # ⚠ 上一版这里的注释写着"主 App 的 flutter analyze 不会跨进包里"—— 那句话是错的，
      # 也正是 CI 报错的根因（根 analyze 确实会分析 packages/** 的 test 文件）。
      # 这里的 `dart pub get` 现在是重复动作（上面脚本已解析过），留着是为了本步不依赖步骤顺序。
      - name: fnthink_push package analyze & test
        working-directory: packages/fnthink_push
        run: |
          dart pub get
          dart analyze --fatal-infos
          # 同上：--reporter 显式写，push_tests 的计数与根工程共用同一支 parse_flutter_log。
          dart test --reporter compact > push_test_output.log 2>&1; EC=$?
          tail -5 push_test_output.log
          if [ $EC -ne 0 ]; then exit $EC; fi
          # 同上：计数交给末步的 --push-log，这里不再另写一份 grep。

      - name: Version consistency check
        run: bash .github/scripts/check_version_consistency.sh

      # 发版闸门（update.md 按构件号 / version.json 回填）的行为测试：不跑整个发版脚本，
      # 只把它里面那两段按标记提取出来跑正反用例。放 PR 门禁是因为这两个闸门一旦退化，
      # 表现是"发版一路绿、线上却发旧包"——本地没人会主动去测它。
      - name: Release gate behavior test
        run: bash .github/scripts/test_release_gates.sh

      # （原「Run code metrics analysis」步已删，roadmap E2）：`dart_code_metrics 4.12.0` 自带的
      # analyzer 3.3.1 解析不了 Dart 3.12，实跑恒抛 `Null check operator used on a null value`
      # （exit 255）；而该步 `EXIT_CODE=$?` 赋值后**从未被读** ⇒ 结构上不可能判红，日志也不上传。
      # 它唯一的产出是十几秒 CI 时间 + "门禁表上像有一道质量闸"。它配的 4 条规则里
      # prefer-trailing-comma 与已启用的 require_trailing_commas 重复，其余按实测（lib/ 里 47 处
      # `== true` 多为 Map 动态读值的必要写法、9 处 `!`）复活后主要产噪声。
      # 真要复杂度/断言治理请单独评估后继独立 CLI `dcm`，**不要**把这个依赖加回来；
      # 上面那步改成 `--fatal-infos` 才是这道门禁该有的样子。

      - name: Run unit tests
        run: |
          set +e
          # ⚠ --reporter 必须显式写。上一版没写，靠默认值：默认 reporter 随 Flutter 版本与
          # 是否 TTY 变（CI 是 3.47.7、非 TTY），一旦落到 expanded/github 就没有 `+N` 汇总行，
          # 于是 shell grep 与 gen_readings.py 的 parse_flutter_log 在同一份 log 上双双取空
          # ⇒ READINGS_DART_TESTS 写成空串 ⇒ 闸门报"当前无采集来源"（2026-10-24 实测）。
          flutter test --no-pub --coverage --reporter compact > test_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat test_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 测试失败，CI失败"
            exit 1
          fi
          echo "✅ 所有测试通过"
          # 计数不在这里做：交给末步把 test_output.log 喂给 gen_readings.py 的
          # parse_flutter_log（唯一作者）。上一版这里另写一份 shell grep，只取 `+N`
          # 不含 `~S`，而工具里 env 优先级最高 ⇒ 一旦有用例被 skip，这份复制品就会
          # **盖住**正确读数（2026-10-24：CI 取到 3413，真值 3413+4=3417）。

      # ↓ 以下三步把 base.md §10.2「按 GitHub Actions 检验流程完整自检」声明的
      #   6 项检查真正接进 PR 门禁。此前 Android 单元测试只在打 tag 的
      #   build-apk.yml 里跑（合入前不受约束），服务端契约测试则完全没接 CI。

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android unit tests (JVM)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --console=plain
          # 计数交给末步的 --kotlin-xml（gen_readings.py 的 parse_kotlin_xml 是唯一作者）。
          # 上一版在这里另写一段 python heredoc 求和，且 glob 用了相对路径 —— 本步
          # working-directory 是 android/，而 Gradle buildDir 被重定向到**仓库根** build/，
          # 于是它恒得 0；又因为工具里 env 优先级最高，那个 0 会盖掉正确读数
          # （文档 627/77，仓库根实测解析恰为 (627,77)）。删掉这份复制品，路径也不再靠 cwd。

      # Android lint：抓编译器与 flutter analyze 都看不见的跨版本误用
      # （NewApi / WrongConstant / 未加导出标志的 registerReceiver 等——在 minSdk 24
      # 上表现为运行期 NoSuchMethodError，而不是编译错误）。
      # 已知误报由 android/app/lint-baseline.xml 兜住；新增 issue 不在基线内 → 依旧红。
      - name: Android lint (debug)
        working-directory: android
        run: ./gradlew :app:lintDebug --console=plain

      # Node 版本必须与生产一致（服务器 pm2 跑的是 24 LTS）——CI 用 EOL 运行时测服务端，
      # 等于测了一个生产不该跑的版本；反之亦然。版本单一真值见 server/package.json 的 engines。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Server HTTP contract tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test > jest_output.log 2>&1; EC=$?
          tail -8 jest_output.log
          if [ $EC -ne 0 ]; then exit $EC; fi
          # 同上：计数交给末步的 --jest-log（parse_jest_log 取的是 `total`，
          # 与 passed/skipped 的措辞无关）。这里不再另写一份 grep。

      # 代码格式统一闸门（本地跑同一支：bash .github/scripts/check_format.sh --fix）
      # 三路一并校验：dart format / ktlint 1.8.0（规则见仓库根 .editorconfig）/ prettier。
      # 放在 JDK 与 server/node_modules 就绪之后，prettier 直接复用 npm script。
      - name: Code format check (Dart / Kotlin / JS)
        run: bash .github/scripts/check_format.sh

      # 读数单一来源（T182）：四份公开文档里的 <!--k:key--> 读数块与实测对账，
      # 漂移即红 —— 「文档读数校平」从人工批次变成 CI 拦截。
      # --strict：某键没有采集来源（该步没跑/没导出）也判红，防环境悄悄降级成"没校验"。
      - name: Readings drift check
        run: |
          # 采集只有一条腿：把各步落在 workspace 里的产物喂给 gen_readings.py 自己的
          # 解析器（parse_flutter_log / parse_jest_log / parse_kotlin_xml）—— 它们是这些
          # 例数的**唯一作者**。
          # 为什么不再另写 export：上一版各步各自 grep 一份 READINGS_* 进 $GITHUB_ENV，
          # 而工具里 env 优先级最高 ⇒ 复制品一旦口径不同就**盖住**正确值。实际连踩两次：
          #   ① kotlin 的 glob 用了相对路径（cwd 是 android/）⇒ 恒 0 盖住 627/77；
          #   ② dart 的 grep 只取 `+N` 不含 `~S` ⇒ 有用例被 skip 时盖成 3413（真值 3417）。
          # 产物在就喂、不在就退回 env（仅本地手工覆盖用），仍会被 --strict 判红。
          ARGS=""
          if [ -f test_output.log ]; then ARGS="$ARGS --dart-log test_output.log"; fi
          if [ -f packages/fnthink_push/push_test_output.log ]; then
            ARGS="$ARGS --push-log packages/fnthink_push/push_test_output.log"
          fi
          if [ -f server/jest_output.log ]; then ARGS="$ARGS --jest-log server/jest_output.log"; fi
          if [ -d "$GITHUB_WORKSPACE/build/app/test-results/testDebugUnitTest" ]; then
            ARGS="$ARGS --kotlin-xml $GITHUB_WORKSPACE/build/app/test-results/testDebugUnitTest"
          fi
          echo "带产物参数：${ARGS:-（无，全部依赖 READINGS_* 环境变量）}"
          python3 tools/gen_readings.py --check README.md README-en.md CONTRIBUTING.md CONTRIBUTING-en.md --strict $ARGS

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          genhtml coverage/lcov.info -o coverage/html
          echo "✅ 代码覆盖率报告已生成"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/html/