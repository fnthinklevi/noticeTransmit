# 集成测试（每周自动 + 可手动；模拟器按分钟计费）：
#
# 拆成两个 job 的理由（㊼）：
#   原来一个 job 里顺序跑 smoke → walkthrough → connectedAndroidTest，共用一个 45 分钟预算。
#   后果是「慢的那个把预算吃掉，快的那个还没跑到就没结论」，而且红的时候只能去翻日志。
#   现在：
#     · device-basic   = 冒烟主链路（4 个分步用例）+ androidTest 仪表测试（同一台模拟器，都很快）
#     · walkthrough    = 发版全功能点击闸门（一条长链路，单独预算，不与上面抢时间）
#   两个 job 各判各的 ⇒ 哪个红一目了然，也不会互相顶掉结论。
#
# 每条失败都会：写 ::error:: 注解（run 页面直接可见，不再只能下日志）、把设备日志
# 落进 test_report/、无论成败都上传产物（绿的时候要能证明它真跑过，而不是"没跑所以绿"）。
name: Integration Test

on:
  workflow_dispatch:
  # E3：此前只有 workflow_dispatch ⇒ 这条链在 PR 上永远不跑，装配顺序类生产缺陷
  # （㉗ 的 locale 事故）只能靠人记得去点。每周二 03:00 UTC 自动跑一次；
  # 只想省分钟数时可把下面两行删掉，手动触发仍然保留。
  schedule:
    - cron: '0 3 * * 2'

env:
  # ⚠ 必须与 analyze.yml / build-apk.yml 一致：以前这里只写 channel: stable，于是冒烟
  #   跑在「当时最新的 stable」上（失败表现是 Gradle 构建成功后 0 tests、看不到异常文本）。
  FLUTTER_VERSION: '3.44.4'

jobs:
  device-basic:
    name: 冒烟主链路 + 仪表测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run smoke + instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # ⚠ 这一段跑在 /bin/sh（dash）里，不是 bash —— `android-emulator-runner` 用的是
            #   `child_process.exec`，Linux 上默认 shell 就是 sh。所以这里**不许**出现 bash 专有
            #   语法（`${PIPESTATUS[0]}` / `[[ ]]` / `set -o pipefail`）：dash 在解析期就 exit 2，
            #   `set +e` 根本来不及生效 ⇒ 整段脚本一次都没跑过，而 CI 上看到的是"测试红了"。
            #   取管道左侧退出码的写法是「重定向到文件 → $? → cat 出来」，两边都在 POSIX 里。
            #   由 `test/architecture/release_gate_emulator_test.dart` 的「CI 脚本不许有 bash 专有写法」钉住。
            set +e
            set +e
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            flutter devices
            # --reporter expanded：每个用例名单独一行。冒烟已按步拆成 4 个用例，
            # 于是"哪一步红"直接出现在日志里（以前是一条巨型用例，只知道"冒烟红了"）。
            flutter test integration_test/smoke_test.dart --reporter expanded > test_report/smoke.log 2>&1
            smoke_status=$?
            # 不用管道取左侧退出码（`${PIPESTATUS[0]}` 在 dash 上解析期就死）——重定向后 $? 就是它的
            cat test_report/smoke.log
            # 仪表测试（androidTest）：必须复用这台存活模拟器，独立 step 会因模拟器已关而找不到设备
            (cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest) > test_report/connected.log 2>&1
            connected_status=$?
            cat test_report/connected.log
            # 应用侧崩溃只出现在 logcat：没有它，CI 上永远只能看到 "0 tests passed"
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb shell dumpsys activity activities > test_report/activities.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            if [ "$smoke_status" != "0" ] || [ "$connected_status" != "0" ]; then
              tail -n 120 test_report/logcat_crash.txt
              tail -n 60 test_report/logcat.txt
              echo "::error::device-basic 失败 smoke=$smoke_status connectedAndroidTest=$connected_status（test_report 产物已上传）"
            fi
            echo "CI-STATUS device-basic smoke=$smoke_status connectedAndroidTest=$connected_status"
            # ⚠ 写摘要之前必须判空。run#11 的证据：两个子步骤**都是 0**（smoke 末行
            #   `+4: All tests passed!`；connectedDebugAndroidTest 末行 `BUILD SUCCESSFUL`，
            #   产物里 smoke.log／connected.log／logcat.txt／logcat_crash.txt／activities.txt 五件齐），
            #   job 却以 `sh exit 2` 收 ⇒ 尾部能吞掉 shell 的只剩这一段。
            #   `$GITHUB_STEP_SUMMARY` 为空时 `} >> ""` 在 bash 里只是那条命令失败（本机复跑过整段，
            #   仍回 0），在 dash 里行为**未经验证** ⇒ 判空一次同时消掉两种可能。
            #   上面那行 CI-STATUS 是下一轮的定位锚：日志里有它 = 死在它之后，没它 = 死在它之前。
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### device-basic"
                echo "- smoke（4 个分步用例）：exit \`$smoke_status\`"
                echo "- connectedAndroidTest：exit \`$connected_status\`"
                echo '```'
                grep -E "^[0-9]{2}:[0-9]{2} (\+[0-9]+.*(-[0-9]+)?: |All tests passed|Some tests failed)|FAILURE|Exception|tests? (completed|failed)" \
                  test_report/smoke.log | tail -n 25
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            [ "$smoke_status" = "0" ] && [ "$connected_status" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build outputs（仅失败时，体积大）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-build
          path: build/
          if-no-files-found: ignore

  walkthrough:
    name: 发版全功能点击闸门
    runs-on: ubuntu-24.04
    # 单独预算：闸门按用例分**独立调用**跑（一条挂住会带走同 isolate 里后面的用例，
    # 见 release_emulator.sh 第 16 轮的说明），所以这里的算式是
    #   Σ(四条用例超时)=25′ + 每次调用的重装/启动 4×4′ + smoke + 构建
    # 顶格 45′ 会被"四条同时挂满"这种病态形状先掐掉 ⇒ 提到 60′（正常轮实测 ~12′）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run full-feature click gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            # ㊻ 发版硬闸门（base.md 步骤 6.7）：所有可达页面逐个进入、每条 CRUD 各走一次、
            # 备份真落盘再真读回。分节失败由测试自己收集后一次性报，日志里是 GATE-STEP-FAIL。
            # CI-MARK：run#11 的产物里**只有 flutter_version.txt**（连 walkthrough.log 都没生成，
            #   而那个文件在重定向发生时就会被创建）⇒ 这一支死在闸门测试启动之前。
            #   这行标记出现在日志里 = 死点在其后，没出现 = 死点在其前，下一轮不再靠猜。
            echo "CI-MARK walkthrough about to run release_walkthrough_test.dart"
            flutter test integration_test/release_walkthrough_test.dart --reporter expanded \
              > test_report/walkthrough.log 2>&1
            walk_status=$?
            cat test_report/walkthrough.log
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            if [ "$walk_status" != "0" ]; then
              grep -E "GATE-STEP-FAIL|GATE-DIAG" test_report/walkthrough.log | tail -n 40
              tail -n 60 test_report/logcat_crash.txt
              echo "::error::walkthrough 失败 exit=$walk_status（GATE-STEP-FAIL 见日志与产物）"
            fi
            echo "CI-STATUS walkthrough release_walkthrough_test=$walk_status"
            # 判空再写摘要，理由与 device-basic 那段注释同源（那里写了完整版，这里不复制第二份真值）。
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### walkthrough"
                echo "- release_walkthrough_test.dart：exit \`$walk_status\`"
                echo '```'
                grep -E "GATE-STEP-FAIL|All tests passed|Some tests failed" test_report/walkthrough.log | tail -n 25
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            [ "$walk_status" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14
