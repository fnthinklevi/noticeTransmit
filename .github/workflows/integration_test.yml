# 集成测试（每周自动 + 可手动；模拟器按分钟计费）：
#
# 拆成两个 job 的理由（㊼）：
#   原来一个 job 里顺序跑 smoke → walkthrough → connectedAndroidTest，共用一个 45 分钟预算。
#   后果是「慢的那个把预算吃掉，快的那个还没跑到就没结论」，而且红的时候只能去翻日志。
#   现在：
#     · device-basic   = 冒烟主链路（4 个分步用例）+ androidTest 仪表测试（同一台模拟器，都很快）
#     · walkthrough    = 发版全功能点击闸门（一条长链路，单独预算，不与上面抢时间）
#   两个 job 各判各的 ⇒ 哪个红一目了然，也不会互相顶掉结论。
#
# 每条失败都会：写 ::error:: 注解（run 页面直接可见，不再只能下日志）、把设备日志
# 落进 test_report/、无论成败都上传产物（绿的时候要能证明它真跑过，而不是"没跑所以绿"）。
name: Integration Test

on:
  workflow_dispatch:
  # E3：此前只有 workflow_dispatch ⇒ 这条链在 PR 上永远不跑，装配顺序类生产缺陷
  # （㉗ 的 locale 事故）只能靠人记得去点。每周二 03:00 UTC 自动跑一次；
  # 只想省分钟数时可把下面两行删掉，手动触发仍然保留。
  schedule:
    - cron: '0 3 * * 2'

env:
  # ⚠ 必须与 analyze.yml / build-apk.yml 一致：以前这里只写 channel: stable，于是冒烟
  #   跑在「当时最新的 stable」上（失败表现是 Gradle 构建成功后 0 tests、看不到异常文本）。
  FLUTTER_VERSION: '3.44.4'

jobs:
  device-basic:
    name: 冒烟主链路 + 仪表测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run smoke + instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # ⚠⚠ 这一段由 `android-emulator-runner` **按行拆开、每行单独 `sh -c 一行`，每行一个新进程**。
            #   三条硬后果，全是 CI 实测出来的，不是推测：
            #     ① 跨行结构一律语法错 —— run#11 日志：
            #        `/usr/bin/sh -c if [ "$smoke_status" != "0" ] … ; then` 紧跟
            #        `sh: 1: Syntax error: end of file unexpected (expecting "fi")` ⇒ exit 2。
            #     ② **shell 变量不跨行存活** —— run#12 的注解是 `device-basic 失败 smoke= connectedAndroidTest=`，
            #        两个变量都是空的：赋值那行与读取那行是两个进程。⇒ 状态只能走**文件**；
            #        否则 `[ "" = "0" ]` 恒假 ⇒ **测试全绿也会被判成红 job**（run#12 正是这样）。
            #     ③ 任何一行返回非 0 就中止后面的行 —— run#10：connected 失败后三条 adb 没跑，
            #        产物里就没有 logcat 三件。⇒ 除最后那行判行外，**每行都要以 0 结尾**。
            #   所以本段的形状是固定的：同行取码（`cmd > log 2>&1; echo $? > 状态文件`）、
            #   条件写成单行 `if …; then …; fi`、判读一律 `$(cat 状态文件)`。
            #   由 `test/architecture/release_gate_emulator_test.dart` 三条钉住：跨行结构／跨行变量／bash 专有语法。
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            flutter devices
            flutter test integration_test/smoke_test.dart --reporter expanded > test_report/smoke.log 2>&1; echo $? > test_report/smoke_status.txt
            cat test_report/smoke.log
            (cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest) > test_report/connected.log 2>&1; echo $? > test_report/connected_status.txt
            cat test_report/connected.log
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb shell dumpsys activity activities > test_report/activities.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            echo "CI-STATUS device-basic smoke=$(cat test_report/smoke_status.txt) connectedAndroidTest=$(cat test_report/connected_status.txt)"
            if [ "$(cat test_report/smoke_status.txt)" != "0" ] || [ "$(cat test_report/connected_status.txt)" != "0" ]; then tail -n 120 test_report/logcat_crash.txt; tail -n 60 test_report/logcat.txt; echo "::error::device-basic 失败 smoke=$(cat test_report/smoke_status.txt) connectedAndroidTest=$(cat test_report/connected_status.txt)（test_report 产物已上传）"; fi
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then { echo "### device-basic"; echo "- smoke（4 个分步用例）：exit \`$(cat test_report/smoke_status.txt)\`"; echo "- connectedAndroidTest：exit \`$(cat test_report/connected_status.txt)\`"; grep -E "All tests passed|Some tests failed|FAILURE|Exception" test_report/smoke.log | tail -n 15; true; } >> "$GITHUB_STEP_SUMMARY"; fi
            [ "$(cat test_report/smoke_status.txt)" = "0" ] && [ "$(cat test_report/connected_status.txt)" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build outputs（仅失败时，体积大）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-build
          path: build/
          if-no-files-found: ignore

  walkthrough:
    name: 发版全功能点击闸门
    runs-on: ubuntu-24.04
    # 单独预算：闸门按用例分**独立调用**跑（一条挂住会带走同 isolate 里后面的用例，
    # 见 release_emulator.sh 第 16 轮的说明），所以这里的算式是
    #   Σ(四条用例超时)=25′ + 每次调用的重装/启动 4×4′ + smoke + 构建
    # 顶格 45′ 会被"四条同时挂满"这种病态形状先掐掉 ⇒ 提到 60′（正常轮实测 ~12′）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run full-feature click gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # 每行自包含、状态走文件、除判行外每行以 0 结尾 —— 机制与三条硬后果写在 device-basic 那段
            # 注释里（一份真值，这里不复制第二份）。
            # CI-MARK／CI-STATUS 是定位锚：run#11 这一支的产物只有 flutter_version.txt，
            # 连 walkthrough.log 都没生成 ⇒ 当时死在跨行的 `flutter test … \` 续行上。
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            echo "CI-MARK walkthrough about to run release_walkthrough_test.dart"
            flutter test integration_test/release_walkthrough_test.dart --reporter expanded > test_report/walkthrough.log 2>&1; echo $? > test_report/walk_status.txt
            cat test_report/walkthrough.log
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            echo "CI-STATUS walkthrough release_walkthrough_test=$(cat test_report/walk_status.txt)"
            if [ "$(cat test_report/walk_status.txt)" != "0" ]; then grep -E "GATE-STEP-FAIL|GATE-DIAG" test_report/walkthrough.log | tail -n 40; tail -n 60 test_report/logcat_crash.txt; echo "::error::walkthrough 失败 exit=$(cat test_report/walk_status.txt)（GATE-STEP-FAIL 见日志与产物）"; fi
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then { echo "### walkthrough"; echo "- release_walkthrough_test.dart：exit \`$(cat test_report/walk_status.txt)\`"; grep -E "GATE-STEP-FAIL|All tests passed|Some tests failed" test_report/walkthrough.log | tail -n 15; true; } >> "$GITHUB_STEP_SUMMARY"; fi
            [ "$(cat test_report/walk_status.txt)" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14
