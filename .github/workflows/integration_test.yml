# 集成测试：真机/模拟器跑两类设备侧测试（手动触发，模拟器分钟级计费）：
# 1. integration_test/smoke_test.dart —— 7 步主链路冒烟
# 2. androidTest 仪表测试（connectedDebugAndroidTest，含 ApkSignatureVerifier 等）——
#    必须在 emulator-runner 的 script 内执行（模拟器存活期间），独立 step 会因
#    模拟器已关闭而找不到设备。
name: Integration Test

on:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run integration smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            flutter devices
            flutter test integration_test/smoke_test.dart --verbose
            # 仪表测试（androidTest）：复用同一台存活模拟器
            cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure
          path: |
            build/
            test_report/
          if-no-files-found: ignore
