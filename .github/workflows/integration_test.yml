# 集成测试（每周自动 + 可手动；模拟器按分钟计费）：
#
# 拆成两个 job 的理由（㊼）：
#   原来一个 job 里顺序跑 smoke → walkthrough → connectedAndroidTest，共用一个 45 分钟预算。
#   后果是「慢的那个把预算吃掉，快的那个还没跑到就没结论」，而且红的时候只能去翻日志。
#   现在：
#     · device-basic   = 冒烟主链路（4 个分步用例）+ androidTest 仪表测试（同一台模拟器，都很快）
#     · walkthrough    = 发版全功能点击闸门（一条长链路，单独预算，不与上面抢时间）
#   两个 job 各判各的 ⇒ 哪个红一目了然，也不会互相顶掉结论。
#
# 每条失败都会：写 ::error:: 注解（run 页面直接可见，不再只能下日志）、把设备日志
# 落进 test_report/、无论成败都上传产物（绿的时候要能证明它真跑过，而不是"没跑所以绿"）。
name: Integration Test

on:
  workflow_dispatch:
  # E3：此前只有 workflow_dispatch ⇒ 这条链在 PR 上永远不跑，装配顺序类生产缺陷
  # （㉗ 的 locale 事故）只能靠人记得去点。每周二 03:00 UTC 自动跑一次；
  # 只想省分钟数时可把下面两行删掉，手动触发仍然保留。
  schedule:
    - cron: '0 3 * * 2'

env:
  # ⚠ 必须与 analyze.yml / build-apk.yml 一致：以前这里只写 channel: stable，于是冒烟
  #   跑在「当时最新的 stable」上（失败表现是 Gradle 构建成功后 0 tests、看不到异常文本）。
  FLUTTER_VERSION: '3.44.4'

jobs:
  device-basic:
    name: 冒烟主链路 + 仪表测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run smoke + instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # ⚠⚠ 这一段由 `android-emulator-runner` **按行拆开、每行单独 `sh -c 一行`** 执行，
            #   不是一次跑整段脚本。run#11 的日志把这条钉死了：
            #     /usr/bin/sh -c if [ "$smoke_status" != "0" ] || [ "$connected_status" != "0" ]; then
            #     /usr/bin/sh: 1: Syntax error: end of file unexpected (expecting "fi")
            #   ⇒ 任何**跨行结构**（`if … fi`、`{ … }` 块、`\` 续行）都会变成"给 sh 半句话"，
            #     当场语法错 exit 2。walkthrough 那边连 walkthrough.log 都没生成，就是死在
            #     `flutter test … \` ＋ 下一行 `> test_report/walkthrough.log` 这个两行写法上。
            #   ⇒ 而且**任何一行返回非 0 就中止后面的行**（run#10：connected 失败后三条 adb 没跑，
            #     产物里就没有 logcat 三件 —— `set +e` 对"下一行"无效，它是另一个进程）。
            #   所以这里的写法是硬要求：**每行自包含、每行都以 0 结尾，只有最后判行例外**：
            #     · 取退出码与命令同行：`cmd > log 2>&1; x=$?`（赋值成功 ⇒ 整行 0）
            #     · 条件块单行：`[ 条件 ] && { a; b; } || true`
            #     · 不许 bash 专有语法（`${PIPESTATUS[0]}`／`[[ ]]`／`set -o pipefail`）—— T64 那一课
            #   由 `test/architecture/release_gate_emulator_test.dart` 那两条一起钉住（形状＋bash 专有）。
            set +e
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            flutter devices
            flutter test integration_test/smoke_test.dart --reporter expanded > test_report/smoke.log 2>&1; smoke_status=$?
            cat test_report/smoke.log
            (cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest) > test_report/connected.log 2>&1; connected_status=$?
            cat test_report/connected.log
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb shell dumpsys activity activities > test_report/activities.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            echo "CI-STATUS device-basic smoke=$smoke_status connectedAndroidTest=$connected_status"
            [ "$smoke_status" != "0" ] && { tail -n 120 test_report/logcat_crash.txt; tail -n 60 test_report/logcat.txt; echo "::error::device-basic 失败 smoke=$smoke_status connectedAndroidTest=$connected_status（test_report 产物已上传）"; } || true
            [ -n "$GITHUB_STEP_SUMMARY" ] && { echo "### device-basic"; echo "- smoke（4 个分步用例）：exit \`$smoke_status\`"; echo "- connectedAndroidTest：exit \`$connected_status\`"; grep -E "All tests passed|Some tests failed|FAILURE|Exception" test_report/smoke.log | tail -n 15; } >> "$GITHUB_STEP_SUMMARY" || true
            [ "$smoke_status" = "0" ] && [ "$connected_status" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build outputs（仅失败时，体积大）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-basic-build
          path: build/
          if-no-files-found: ignore

  walkthrough:
    name: 发版全功能点击闸门
    runs-on: ubuntu-24.04
    # 单独预算：闸门按用例分**独立调用**跑（一条挂住会带走同 isolate 里后面的用例，
    # 见 release_emulator.sh 第 16 轮的说明），所以这里的算式是
    #   Σ(四条用例超时)=25′ + 每次调用的重装/启动 4×4′ + smoke + 构建
    # 顶格 45′ 会被"四条同时挂满"这种病态形状先掐掉 ⇒ 提到 60′（正常轮实测 ~12′）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run full-feature click gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # 每行自包含、每行都以 0 结尾（机制与理由写在 device-basic 那段注释里，这里不放第二份真值）。
            # CI-MARK／CI-STATUS 是定位锚：run#11 里这一支的产物只有 flutter_version.txt，
            # 连 walkthrough.log 都没生成 —— 死在闸门测试启动之前（那条两行的 `flutter test … \` 写法）。
            set +e
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            echo "CI-MARK walkthrough about to run release_walkthrough_test.dart"
            flutter test integration_test/release_walkthrough_test.dart --reporter expanded > test_report/walkthrough.log 2>&1; walk_status=$?
            cat test_report/walkthrough.log
            adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
            adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
            echo "CI-STATUS walkthrough release_walkthrough_test=$walk_status"
            [ "$walk_status" != "0" ] && { grep -E "GATE-STEP-FAIL|GATE-DIAG" test_report/walkthrough.log | tail -n 40; tail -n 60 test_report/logcat_crash.txt; echo "::error::walkthrough 失败 exit=$walk_status（GATE-STEP-FAIL 见日志与产物）"; } || true
            [ -n "$GITHUB_STEP_SUMMARY" ] && { echo "### walkthrough"; echo "- release_walkthrough_test.dart：exit \`$walk_status\`"; grep -E "GATE-STEP-FAIL|All tests passed|Some tests failed" test_report/walkthrough.log | tail -n 15; } >> "$GITHUB_STEP_SUMMARY" || true
            [ "$walk_status" = "0" ]

      - name: Upload test report（无论成败都留档）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walkthrough-report
          path: test_report/
          if-no-files-found: error
          retention-days: 14
