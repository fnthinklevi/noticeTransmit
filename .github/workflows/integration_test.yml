# 集成测试：真机/模拟器跑两类设备侧测试（每周自动 + 可手动；模拟器分钟级计费）：
# 1. integration_test/smoke_test.dart —— 7 步主链路冒烟
# 2. androidTest 仪表测试（connectedDebugAndroidTest，含 ApkSignatureVerifier 等）——
#    必须在 emulator-runner 的 script 内执行（模拟器存活期间），独立 step 会因
#    模拟器已关闭而找不到设备。
name: Integration Test

on:
  workflow_dispatch:
  # E3：此前只有 workflow_dispatch ⇒ 这条链在 PR 上永远不跑，装配顺序类生产缺陷
  # （㉗ 的 locale 事故）只能靠人记得去点。每周二 03:00 UTC 自动跑一次；
  # 只想省分钟数时可把下面两行删掉，手动触发仍然保留。
  schedule:
    - cron: '0 3 * * 2'

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          # ⚠ 版本必须与 analyze.yml / build-apk.yml 一致：以前这里只写 channel: stable，
          #   于是冒烟测试跑在「当时最新的 stable」上，可能比两道门禁更新
          #   （失败表现是 Gradle 构建成功后 0 tests、且看不到异常文本，排查方向直接被带偏）。
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pub get
        run: flutter pub get

      - name: Run integration smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # android-emulator-runner 以 bash -e 执行脚本；这里显式关掉 errexit，
            # 否则第一条失败命令会直接中止，下面的设备日志（唯一的真线索）就抓不到了。
            set +e
            mkdir -p test_report
            flutter --version | tee test_report/flutter_version.txt
            flutter devices
            flutter test integration_test/smoke_test.dart --verbose 2>&1 | tee test_report/smoke.log
            smoke_status=${PIPESTATUS[0]}
            if [ "$smoke_status" != "0" ]; then
              # 应用侧崩溃只出现在 logcat：没有它，CI 上永远只能看到 "0 tests passed"
              adb logcat -d -v time -t 3000 > test_report/logcat.txt 2>&1
              adb shell dumpsys activity activities > test_report/activities.txt 2>&1
              adb logcat -d -b crash -t 500 > test_report/logcat_crash.txt 2>&1
              tail -n 120 test_report/logcat_crash.txt
              tail -n 60 test_report/logcat.txt
            fi
            # 仪表测试（androidTest）：复用同一台存活模拟器
            (cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest) 2>&1 | tee test_report/connected.log
            connected_status=${PIPESTATUS[0]}
            if [ "$smoke_status" != "0" ] || [ "$connected_status" != "0" ]; then
              echo "❌ smoke=$smoke_status connectedAndroidTest=$connected_status（日志见 test_report/ 产物）"
              exit 1
            fi

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure
          path: |
            build/
            test_report/
          if-no-files-found: ignore
