name: notice_transmit
description: "通知推送助手 - 幻念团队 fnthinklevi"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and build-number is used as the build suffix.
version: 1.6.5+165
license: apache-2.0

environment:
  # Flutter 3.47.7 / Dart 3.13.5（CI 三处 pin 同值）：地板抬到 3.13，
  # 让"用旧 SDK 构建"在 pub get 这一层就断，而不是等到 formatter／分析器给出不同结果。
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 幻念推送（roadmap T71 起）：同仓独立包，本仓库第一个 path 依赖。
  # 协议表只有一份（protocol/fnthink-v1.json），Dart 与服务端各自读它跑契约测试；
  # 将来出现第二个消费者或独立发版节奏时，整包平移成独立仓库。
  fnthink_push:
    path: packages/fnthink_push
  # gen-l10n 生成代码的运行时依赖（见 l10n.yaml）
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  http: ^1.2.2
  uuid: ^4.6.0
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  workmanager: ^0.10.10

  permission_handler: ^13.0.2
  get_it: ^9.3.0
  sqflite_sqlcipher: ^3.4.1
  path: ^1.8.3
  crypto: ^3.0.3
  flutter_secure_storage: ^10.3.1
  # P1 配置备份恢复：PBKDF2 + AES-256-GCM（口令派生加密）与 .nbackup 文件选取
  cryptography: ^2.7.0
  file_picker: ^13.1.0
  flutter_slidable: ^4.0.3
  # 远程执行 TOTP 的二维码图片（片3c）：把 otpauth:// 链接画成图给用户扫。
  # ⚠ 选它而不是自己写 QR 编码器：MIT、纯 Dart 生成内核（依赖 qr）、
  #   pub.dev 上 18 万次下载 —— 自己写那一套等于给安全面引入一处没被审过的实现。
  #   选定版本要钉住 patch 位（3.6.0），理由见 roadmap 8.184。
  pretty_qr_code: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # file_picker 13 的 PlatformFile 抽象基类暴露 XFile；集成闸门的假实现需要它。
  cross_file: ^0.3.5+4
  # 真机/模拟器集成冒烟测试（integration_test/smoke_test.dart，CI 见 integration_test.yml）
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.2.0
  # 设备侧探针直接构造 vendored sqflite_common 的 helper/doOpen（绕开 Dart 层
  # singleInstance 缓存，逼原生 recover 分支），所以它是直接 dev 依赖。
  # 版本由上面 dependency_overrides 指到 third_party。
  sqflite_common: ^2.5.11

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# sqflite_common 2.5.11 在 `recoveredInTransaction` 分支硬转
# `SqfliteOpenDatabaseOptions`，而 `sqflite_sqlcipher` 传入的是自己的 options
# 实现（不是它的子类）⇒ CastError；且 ROLLBACK 排在 cast 之后，永远发不出去。
# 表现是"后台引擎留下的悬挂事务"把前台开库永久卡死（真机 2026-10-29 实测）。
# vendored 补丁只改两处 cast，详见 third_party/sqflite_common/PATCHES.md。
# 上游修复后删除本 override 与 third_party 目录。
#
# shared_preferences_android 2.5.x 把读路换成 JNI，其类型转换表只认
# Long/Double/String/Boolean/数组/List/Map，不认 Integer/Float；而原生往
# FlutterSharedPreferences 写过 putInt（FnthinkLiveMode / ChannelAvailability），
# 存量设备文件里就有 <int> ⇒ getAll 抛 ArgumentError(JObject)，全应用
# SharedPreferences.getInstance() 失败（真机 2026-11-08：初始化失败 + 每次弹
# 隐私政策 + 界面"已停止"但原生仍在监听）。上游截至 2.5.4 无修复。
# 2.4.x 读路走 pigeon method channel，标准 codec 天然认 Integer/Float。
# 抬回 2.5.x 的前提：上游 readValue 补 Integer/Float，或原生长整型化＋存量迁移。
# 守卫：test/architecture/shared_preferences_jni_integer_guard_test.dart。
dependency_overrides:
  sqflite_common:
    path: third_party/sqflite_common
  shared_preferences_android: 2.4.28

# sqlite3（dev 依赖，经 sqflite_common_ffi 供宿主侧 Dart 测试）的 build hook 默认
# 从 GitHub release 下载预编译库并用包内钉值校验 sha256。2026-11-08 起 GitHub
# release 资产 CDN 持续 504（本机与 CI 各连续 15–20 次失败，ninja 等无关仓库同病），
# 而 hook 不校验 HTTP 状态码 ⇒ 504 错误页字节被原样流进 sha256 ⇒ 测试在
# "Building native assets" 阶段直接 exit 255，一条用例都没跑。
# Linux（CI 宿主测试）改为 dlopen 系统库 libsqlite3.so.0，零下载；Ubuntu 的
# libsqlite3-0 是常规预装依赖，analyze.yml 有存在性守护。
# Android 侧这个资产**只被构建、运行时不加载**：集成测试与 app 都不调
# sqfliteFfiInit()（真机 DB 走 sqflite_sqlcipher），所以同样声明成 system ——
# 不打包、不下载；万一将来某处真的加载它，会显式报 "Failed to load dynamic
# library libsqlite3.so"（而不是静默指向 ABI 不同的系统 libsqlite.so）。
# 其余平台（本机 Windows 的 flutter test、Apple 构建）仍用包内自带二进制，
# SQLite 版本与钉值行为不变。
# 写法依据 sqlite3 包 doc/hook.md 的 source / name 按目标 OS 取 map 的语法。
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        android: system
        default: sqlite3
      name:
        linux: sqlite3.so.0
        default: sqlite3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # 启用 gen-l10n 本地化代码生成（配置见 l10n.yaml）
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/app_icon.png
    - assets/icons/
    # 幻念推送的单一协议契约要随包上机：设备上没有一个"仓库根"可以去向上找文件，
    # 而"两端读同一份"这个承诺只有在包里有它才算数（读法见 lib/services/fnthink_contract_loader.dart）。
    - protocol/fnthink-v1.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

