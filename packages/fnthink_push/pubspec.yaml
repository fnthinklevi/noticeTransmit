name: fnthink_push
description: 幻念推送（fnthink push）的协议与凭证实现，随主 App 以 path 依赖引入；将来要开放可整包平移成独立仓库。
publish_to: 'none'
version: 0.1.0
license: apache-2.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  # 只用来算凭证摘要（sha256）。主 App 已依赖同一个包，这里不引入新的解析压力。
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
